<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
  <title id="title">Live audio worship</title>
  <desc id="desc">A microphone and sound waves illustrate listening to a live service.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#121c3c"/>
      <stop offset=".58" stop-color="#343164"/>
      <stop offset="1" stop-color="#85466e"/>
    </linearGradient>
    <linearGradient id="mic" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff"/>
      <stop offset="1" stop-color="#e6c8e7"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="650" rx="30" fill="url(#bg)"/>
  <circle cx="452" cy="292" r="206" fill="#8f6fda" opacity=".12"/>
  <circle cx="452" cy="292" r="136" fill="#e0b6ec" opacity=".10"/>
  <g transform="translate(411 100)" filter="url(#glow)">
    <rect x="0" y="0" width="78" height="198" rx="39" fill="url(#mic)"/>
    <path d="M-29 120v31a68 68 0 0 0 136 0v-31M39 219v73m-44 0h88" fill="none" stroke="#fff" stroke-linecap="round" stroke-width="12"/>
    <path d="M20 38h38M20 64h38M20 90h38" stroke="#6d4f85" stroke-linecap="round" stroke-width="6"/>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M196 273v38m35-81v123m36-154v185m36-115v48m330-39v32m36-88v144m36-174v204m36-124v45" stroke="#eab8d8" stroke-width="12" opacity=".9"/>
    <path d="M144 291v18m600-18v18" stroke="#fff" stroke-width="8" opacity=".6"/>
  </g>
  <g transform="translate(84 66)">
    <rect width="132" height="40" rx="20" fill="#e54663"/>
    <circle cx="22" cy="20" r="5" fill="#fff"/>
    <text x="39" y="26" fill="#fff" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">LIVE AUDIO</text>
  </g>
  <text x="82" y="589" fill="#fff" font-family="Georgia, serif" font-size="29">Join worship from anywhere</text>
</svg>
