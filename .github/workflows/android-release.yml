name: Android signed release

on:
  push:
    branches:
      - main
    paths:
      - 'admin/**'
      - 'assets/**'
      - 'android/**'
      - 'css/**'
      - 'data/**'
      - 'js/**'
      - 'public/**'
      - 'scripts/**'
      - 'supabase/**'
      - 'tests/**'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'service-worker.js'
      - 'vite.config.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    name: Build and publish signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Bump app version and update metadata
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync, writeFileSync } from "node:fs";

          const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
          const lockfile = JSON.parse(readFileSync("package-lock.json", "utf8"));
          const current = packageJson.version;
          const parts = current.split(".").map(Number);
          if (parts.length !== 3 || parts.some((part) => !Number.isSafeInteger(part) || part < 0)) {
            throw new Error("package.json must have a numeric major.minor.patch version.");
          }
          let [major, minor, patch] = parts;
          if (patch < 999) patch += 1;
          else if (minor < 999) { minor += 1; patch = 0; }
          else { major += 1; minor = 0; patch = 0; }
          const next = [major, minor, patch].join(".");

          if (!lockfile.packages || !lockfile.packages[""]) {
            throw new Error("package-lock.json is missing its root package metadata.");
          }
          lockfile.version = next;
          lockfile.packages[""].version = next;
          const versionPath = "js/version.js";
          const versionSource = readFileSync(versionPath, "utf8");
          const oldVersion = 'APP_VERSION = "' + current + '";';
          if (!versionSource.includes(oldVersion)) {
            throw new Error("js/version.js does not match package.json; refusing an unsafe version bump.");
          }
          const cachePath = "service-worker.js";
          const worker = readFileSync(cachePath, "utf8");
          const oldCacheName = 'consolation-hymnal-' + current;
          if (!worker.includes(oldCacheName)) {
            throw new Error("service-worker.js cache version does not match package.json.");
          }
          writeFileSync("package.json", JSON.stringify({ ...packageJson, version: next }, null, 2) + "\n");
          writeFileSync("package-lock.json", JSON.stringify(lockfile, null, 2) + "\n");
          writeFileSync(versionPath, versionSource.replace(oldVersion, 'APP_VERSION = "' + next + '";'));
          writeFileSync(cachePath, worker.replace(oldCacheName, 'consolation-hymnal-' + next));
          appendFileSync(process.env.GITHUB_ENV, "APP_VERSION=" + next + "\n");
          console.log("Prepared app release " + next + ".");
          NODE

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare npm lockfile for GitHub
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const lockfilePath = "package-lock.json";
          const privatePrefix = "http://package-firewall.replit.internal/npm/";
          const publicPrefix = "https://registry.npmjs.org/";
          const original = readFileSync(lockfilePath, "utf8");
          const count = original.split(privatePrefix).length - 1;
          const normalized = original.replaceAll(privatePrefix, publicPrefix);

          if (normalized.includes("package-firewall.replit.internal")) {
            throw new Error("The npm lockfile still contains a Replit-only registry URL.");
          }
          if (count === 0 && !original.includes(publicPrefix)) {
            throw new Error("No recognized npm registry URLs were found in package-lock.json.");
          }
          if (count > 0) {
            writeFileSync(lockfilePath, normalized);
            console.log("Normalized " + count + " package URLs for GitHub Actions.");
          }
          NODE

      - name: Install, test, and build shared web app
        run: |
          npm ci --registry=https://registry.npmjs.org --no-audit --no-fund
          npm test
          npm run build

      - name: Package shared app for Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Decode Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, writeFileSync } from "node:fs";
          import path from "node:path";

          let encoded = (process.env.ANDROID_KEYSTORE_BASE64 || "").replace(/\s/g, "");
          encoded = encoded.replace(/^data:[^,]*base64,/, "").replace(/-/g, "+").replace(/_/g, "/");
          if (!encoded || /[^A-Za-z0-9+/=]/.test(encoded)) {
            throw new Error("ANDROID_KEYSTORE_BASE64 is missing or invalid.");
          }
          const keystore = Buffer.from(encoded, "base64");
          if (!keystore.length) throw new Error("Decoded Android keystore is empty.");
          const keystorePath = path.join(process.env.RUNNER_TEMP, "consolation-hymnal-release.jks");
          writeFileSync(keystorePath, keystore, { mode: 0o600 });
          appendFileSync(process.env.GITHUB_ENV, "ANDROID_KEYSTORE_PATH=" + keystorePath + "\n");
          NODE

      - name: Prepare Android version and signing config
        run: node scripts/prepare-android.mjs

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD secret." >&2; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS secret." >&2; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD secret." >&2; exit 1; }
          cd android
          ./gradlew assembleRelease
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/consolation-hymnal-android.apk

      - name: Commit version, create tag, and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json js/version.js service-worker.js
          git commit -m "Release v$APP_VERSION"
          git tag "v$APP_VERSION"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main advanced during the build; no version commit or tag was pushed. Push again to release the latest app." >&2
            exit 1
          fi
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v$APP_VERSION"
          gh release create "v$APP_VERSION" \
            android/app/build/outputs/apk/release/consolation-hymnal-android.apk \
            --title "Consolation Hymnal v$APP_VERSION" \
            --notes "Signed Android update for version $APP_VERSION."
