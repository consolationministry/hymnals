name: Android signed release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify tag matches app version
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const version = JSON.parse(readFileSync("package.json", "utf8")).version;
          const expectedTag = `v${version}`;
          if (process.env.GITHUB_REF_NAME !== expectedTag) {
            throw new Error(`Release tag ${process.env.GITHUB_REF_NAME} must match ${expectedTag}.`);
          }
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare npm lockfile for GitHub
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const lockfilePath = "package-lock.json";
          const privatePrefix = "http://package-firewall.replit.internal/npm/";
          const publicPrefix = "https://registry.npmjs.org/";
          const original = readFileSync(lockfilePath, "utf8");
          const count = original.split(privatePrefix).length - 1;
          const normalized = original.replaceAll(privatePrefix, publicPrefix);

          if (normalized.includes("package-firewall.replit.internal")) {
            throw new Error("The npm lockfile still contains a Replit-only registry URL.");
          }
          if (count === 0 && !original.includes(publicPrefix)) {
            throw new Error("No recognized npm registry URLs were found in package-lock.json.");
          }
          if (count > 0) {
            writeFileSync(lockfilePath, normalized);
            console.log(`Normalized ${count} package URLs for GitHub Actions.`);
          }
          NODE

      - name: Install, test, and build shared web app
        run: |
          npm ci --registry=https://registry.npmjs.org --no-audit --no-fund
          npm test
          npm run build

      - name: Package shared app for Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Decode Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 secret}"
          encoded="$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]')"
          if [[ "$encoded" == data:*base64,* ]]; then
            encoded="${encoded#*,}"
          fi
          encoded="$(printf '%s' "$encoded" | tr '_-' '/+')"
          case $((${#encoded} % 4)) in
            0) ;;
            2) encoded="${encoded}==" ;;
            3) encoded="${encoded}=" ;;
            *)
              echo "ANDROID_KEYSTORE_BASE64 is not valid Base64." >&2
              exit 1
              ;;
          esac
          case "$encoded" in
            *[!A-Za-z0-9+/=]*)
              echo "ANDROID_KEYSTORE_BASE64 contains invalid characters." >&2
              exit 1
              ;;
          esac
          keystore_path="$RUNNER_TEMP/consolation-hymnal-release.jks"
          if ! printf '%s' "$encoded" | base64 --decode > "$keystore_path"; then
            echo "ANDROID_KEYSTORE_BASE64 could not be decoded; replace it with the keystore's Base64 contents." >&2
            exit 1
          fi
          if [[ ! -s "$keystore_path" ]]; then
            echo "Decoded Android keystore is empty." >&2
            exit 1
          fi
          chmod 600 "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Prepare Android version and signing config
        run: node scripts/prepare-android.mjs

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD secret}"
          cd android
          ./gradlew assembleRelease
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/consolation-hymnal-android.apk

      - name: Create GitHub Release and attach APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            android/app/build/outputs/apk/release/consolation-hymnal-android.apk \
            --title "Consolation Hymnal $GITHUB_REF_NAME" \
            --notes "Signed Android update for version ${GITHUB_REF_NAME#v}."
